# Configuration for Pages CMS (https://pagescms.org) — the editing UI at
# https://app.pagescms.org. Editors log in with GitHub, pick this repo, and
# get a simple form + rich-text editor. Saving commits to master, which
# triggers the GitHub Pages deploy.

media:
  input: static/uploads
  output: /uploads

content:
  - name: information
    label: Information
    description: Articles shown on the Information page and the home page.
    type: collection
    path: content/information
    extension: md
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, date, tags, ruleYear, verified]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Publish date
        type: date
        required: true
        options:
          time: false
      # Provenance. Optional, and only meaningful on rules content — the
      # article layout renders these as a footnote when `source` is filled in.
      # A test requires `verified` whenever `source` is set, and fails once a
      # verified date is more than 400 days old.
      - name: ruleYear
        label: NFHS rules year
        type: number
        description: The rules year this page reflects, e.g. 2026. Leave blank for pages that aren't rules content.
      - name: source
        label: Built from
        type: string
        description: 'What this was written from, e.g. "2026 VPA Football Guide". If you fill this in you must also fill in the checked date.'
      - name: verified
        label: Last checked on
        type: date
        options:
          time: false
        description: The date a human last read this page against the source above. Update it every time you re-check, even if nothing changed.
      # Groups the article on the Information page and lists it on its topic
      # page at /tags/<topic>/. The values here must match the names in
      # content/_data/topics.json — a test asserts the two lists agree.
      - name: tags
        label: Topics
        type: select
        required: true
        description: Pick every topic the article belongs to. Used to group it on the Information page.
        options:
          multiple: true
          values:
            - Getting Started
            - Vermont
            - Rules
            - Mechanics
            - Crew Cards
            - Position Cards
            - Game Management
            - Printable
      - name: body
        label: Body
        type: rich-text

  - name: quizzes
    label: Quizzes
    description: Study quizzes listed on the Quizzes page and the home page.
    type: collection
    path: content/quizzes
    extension: md
    format: yaml-frontmatter
    filename: "quiz-{primary}.md"
    exclude: [README.md, asked-questions.md]
    view:
      fields: [title, level, questions]
      sort: [title, date]
      default:
        sort: title
        order: asc
    fields:
      - name: title
        label: Title
        type: string
        required: true
        description: 'Start with the quiz number so the list stays in order, e.g. "Quiz 006 — Fouls on the Kick".'
      - name: date
        label: Publish date
        type: date
        required: true
        options:
          time: false
      - name: description
        label: Focus
        type: string
        required: true
        description: One line shown under the title in the quiz list, and used as the page meta description.
      - name: source
        label: Source
        type: string
        required: true
      - name: level
        label: Level
        type: select
        options:
          values: [Rookie, Intermediate, Expert]
      - name: questions
        label: Number of questions
        type: number
        required: true
      - name: scope
        label: Scope note
        type: string
      - name: body
        label: Body
        type: rich-text
