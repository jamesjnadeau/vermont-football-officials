<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 270 178" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Getting the ball back in play, crew of 5"><title>Getting the ball back in play, crew of 5</title><style>svg{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
