name: Test and deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Run the tests on every pull request too. Without this nothing checks a
  # branch until it is already on master, which is how a card gate failure
  # first reached a deploy. Only the test job runs here — see the `if` guards
  # on build and deploy; a pull request must not publish to Pages.
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Deploys serialize on one group, so two pushes to master cannot race each
  # other onto Pages. Pull requests group per branch instead: sharing the
  # `pages` group would let a push to any PR cancel the deploy of the commit
  # that had just been merged.
  group: >-
    ${{ github.event_name == 'pull_request'
        && format('pr-{0}', github.ref)
        || 'pages' }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Chromium renders the printable cards. The download is the slow part of
      # a cold build and changes only with the Playwright version, so it is
      # cached on the lockfile rather than fetched every run.
      - uses: actions/cache@v4
        id: playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # The rendered cards, keyed on the run so an edit to one article rebuilds
      # one card and restores the other ten. The cache is content-addressed
      # (lib/cards/cache.js), so a restored entry is only used when every input
      # behind it is unchanged; the key here only decides how much of it
      # survives to the next run.
      - uses: actions/cache@v4
        with:
          path: .cache/cards
          key: cards-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            cards-${{ runner.os }}-
      # npm test builds without a path prefix, so internal links resolve
      # against the _site/ root for linkinator. A card that comes out at three
      # pages, or that lost content to overflow, fails here and stops the
      # deploy: the site keeps serving the last good build while someone looks.
      - run: npm test

  build:
    needs: test
    # Tests run on pull requests; publishing does not.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        id: playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - uses: actions/cache@v4
        with:
          path: .cache/cards
          key: cards-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            cards-${{ runner.os }}-
      - uses: actions/configure-pages@v5
      # The site is served from the custom domain in static/CNAME, so it lives
      # at the domain root and needs no path prefix. (configure-pages' base_path
      # lags the custom domain: it still reports the project path
      # "/vermont-football-officials" on a build that runs before Pages has
      # picked the domain up, which prefixes every asset URL into a 404.)
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
